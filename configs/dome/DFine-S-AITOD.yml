# D-FINE-S baseline on AI-TOD-v2: the plain HybridEncoder and the D-FINE decoder at the S scale
# (include/scale_s.yml) on the shared 200-epoch recipe. 500 queries, D-FINE's fixed top-k: 500 is
# what VisDrone uses and it reaches 96.7% of the boxes here, where D-FINE's default 300 reaches
# 93.0%. The tiles still reach 2667 objects and the evaluator keeps 1500 detections per image,
# which the per-image budget of the Ours config is for.

__include__: [
  '../dataset/aitod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
  './include/scale_s.yml',
  './include/recipe_160.yml',
]

output_dir: ./outputs/dfine_s_aitod

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 500
