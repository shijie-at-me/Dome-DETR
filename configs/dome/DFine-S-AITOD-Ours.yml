# D-FINE-S on AI-TOD-v2 with our method switched on: DFine-S-AITOD plus include/ours.yml (the
# tiles are square, so the cell anchors equal the baseline's here; the other four switches act),
# plus the per-image query budget, which AI-TOD needs and VisDrone does not: a tile holds 4
# objects at the median and up to 2667, 93% of the tiles under 100 and 0.8% over 300 that hold
# 15% of the boxes. A fixed top-k either starves the dense tiles or pays for 1500 queries on
# every sparse one.
#
# The budget needs no head: the encoder already counts. The tile gets the number of tokens the
# encoder scores above 0.4 plus a margin of 200 (the duplicates and background candidates the
# matching needs), rounded up to 100, between 300 and 1500 (train tiles reach 1729, a handful
# of test tiles 2667). On a 6-epoch model the rule covered 99.7% of the test tiles at 303
# queries on average (fixed 300: 99.1%), and the scores only sharpen with training. In training
# the ground-truth count stands in for the token count, and the batches are grouped by object
# count in the same steps of 100, so a batch pads nothing. A counting head (query_budget
# bucket) is still in the code; read on raw logits after logit-adjusted training it sent 93% of
# the tiles to the wrong bucket, all upward.

__include__: [
  './DFine-S-AITOD.yml',
  './include/ours.yml',
]

output_dir: ./outputs/dfine_s_aitod_ours

DFINETransformer:
  # the budget, calibrated on the trained baseline (see ablation/DFine-S-AITOD-2-budget.yml): the
  # tokens the encoder scores above 0.15, rounded up to 100, 300 at least and 1500 at most, and in
  # training the larger of that count and the ground truth's
  query_budget: threshold
  count_threshold: 0.15
  count_margin: 0
  count_round: 100
  count_range: [300, 1500]
  count_train_budget: max

train_dataloader:
  # the batches grouped by object count in the budget's steps of 100, so a batch pads nothing
  group_by_count: {edges: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300]}
