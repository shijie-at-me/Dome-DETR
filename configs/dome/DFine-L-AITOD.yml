# D-FINE-L baseline on AI-TOD-v2: the plain HybridEncoder and the D-FINE decoder at the L scale
# (include/scale_l.yml) on the shared 200-epoch recipe. 500 queries, as VisDrone and the S
# scale use; the tiles reach 2667 objects and the evaluator keeps 1500 detections per image,
# which the per-image budget of the Ours config is for.

__include__: [
  '../dataset/aitod_detection.yml',
  '../runtime.yml',
  './include/dataloader.yml',
  './include/optimizer.yml',
  './include/dome_hgnetv2.yml',
  './include/scale_l.yml',
  './include/recipe_160.yml',
]

output_dir: ./outputs/dfine_l_aitod

DOME:
  encoder: HybridEncoder
  decoder: DFINETransformer

DFINETransformer:
  num_queries: 500
