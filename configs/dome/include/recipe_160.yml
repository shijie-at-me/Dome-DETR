# The training recipe of every D-FINE run here, whatever the scale or dataset: 200 epochs at
# batch 8, AdamW with the backbone at a tenth of the rate, two decays of 0.8, and the last 80
# epochs on clean images (the scale and colour augmentations and multi-scale off from epoch 120,
# where the second decay lands; the flips and rotations stay, stage 2 starts there).
#
# The rate is not decayed again over those 80 epochs. The 160-epoch runs ended with the baseline
# flat (slope -0.03 AP per 10 epochs over its last five) and the fine level still climbing
# (+0.46), so the clean phase is where the models separate, and a third decay would settle both
# at once and blur that.
# Overrides the defaults of optimizer.yml and the datasets' stop_epoch.

optimizer:
  type: AdamW
  params:
    -
      params: '^(?=.*backbone)(?!.*(?:norm|bn)).*$'
      lr: 0.00002
    -
      params: '^(?=.*backbone)(?=.*(?:norm|bn)).*$'
      lr: 0.00002
      weight_decay: 0.
    -
      params: '^(?=.*(?:encoder|decoder))(?=.*(?:norm|bn|bias)).*$'
      weight_decay: 0.

  lr: 0.0002
  betas: [0.9, 0.999]
  weight_decay: 0.000065

lr_scheduler:
  type: MultiStepLR
  milestones: [80, 120]
  gamma: 0.8

epoches: 200
train_dataloader:
  dataset:
    transforms:
      policy:
        epoch: 120
  collate_fn:
    stop_epoch: 120
