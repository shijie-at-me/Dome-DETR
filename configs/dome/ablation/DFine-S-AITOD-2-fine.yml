# The stride study, full fine level: the D-FINE-S baseline plus the stride-2 fine level with its
# two depthwise blocks, at the baseline's fixed 300 queries. Against DFine-S-AITOD-2b-fine-light
# it settles the fine_blocks the ladder's row 3 and include/ours.yml carry; against the baseline
# it is also the fine level's value without the query budget, which the ladder measures with it.
# Not a row of the ladder (that is baseline, budget, fine, min-cells, enc-quality, Ours).

__include__: ['../DFine-S-AITOD.yml']

output_dir: ./outputs/ablation/aitod_s_2_fine

HGNetv2:
  return_stem: True

HybridEncoder:
  fine_in_channels: 32
  fine_dim: 64
  fine_blocks: 2

DFINETransformer:
  anchor_cells: 10
  fine_channels: 64
  num_points: [6, 6, 4, 4, 4]
