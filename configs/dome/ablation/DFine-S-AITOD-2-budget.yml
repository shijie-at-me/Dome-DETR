# AI-TOD ablation, row 2 of 6: the D-FINE-S baseline plus the per-image query budget (the
# threshold rule and the grouped batches of DFine-S-AITOD-Ours.yml). Rows 3 to 5 add the
# switches of include/ours.yml one at a time on top of this file; row 6 is
# DFine-S-AITOD-Ours.yml, whose last step is the null entry.
#
# The budget goes first because the tiles reach 2667 objects and even a fixed 500 queries leaves
# 3.3% of the boxes out of reach: every later switch is then measured on a model that is not
# query-limited, which is what their value in the final model is. The cell anchors of ours.yml come in here as well: on
# the square tiles they equal the baseline's at test time and differ by the multi-scale draw
# alone in training.

__include__: ['../DFine-S-AITOD.yml']

output_dir: ./outputs/ablation/aitod_s_2_budget

DFINETransformer:
  anchor_cells: 10
  # the tokens the encoder scores above 0.15, rounded up to 100, 300 at least and 1500 at most.
  # The threshold is read off the trained baseline (tools/analysis/encoder_scores.py): the score
  # of the token at rank "one per object" has median 0.53 and 5th percentile 0.30, flat in the
  # image's density, so 0.15 sits below the cliff on almost every image and the token count comes
  # out at 2.0 times the object count at the median, 1.7 on the dense tiles. That multiplicative
  # overshoot is the margin the matching needs (the duplicates and background candidates), and it
  # grows with density, which a constant margin does not: 0.4 with a margin of 200, calibrated on
  # a 6-epoch model, covered 85% of the images against this rule's 99.5% and cost more queries.
  # Weighted over the split: 312 queries an image on average, 0.38% of the objects beyond the
  # budget, against 6.95% for a fixed 300, 3.35% for the fixed 500 of the baseline and 0.32% for
  # a fixed 1500. The floor is the baseline's 500, so no image is given fewer queries than the
  # row it is compared with and the dense ones are given more.
  query_budget: threshold
  count_threshold: 0.15
  count_margin: 0
  count_round: 100
  count_range: [500, 1500]
  # in training the budget is the larger of the rule's count and the ground truth's, so the model
  # sees the budgets the rule hands out at inference and never fewer queries than it has objects
  # (the score head starts at a 0.01 prior, so the rule contributes nothing before it has learnt)
  count_train_budget: max

train_dataloader:
  # the batches grouped by object count in the budget's steps of 100, so a batch pads nothing
  group_by_count: {edges: [100, 200, 300, 400, 500, 600, 700, 800, 900, 1000, 1100, 1200, 1300]}
