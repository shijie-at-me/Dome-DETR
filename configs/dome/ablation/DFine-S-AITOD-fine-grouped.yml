# Fine-level design study: the fine level as a multi-head map, on the plain baseline (ELAN kept,
# so this is the baseline + a fine level, not the budget-swap 1b/F line). The fine map is widened
# to 256 = num_heads x head_dim and split into 8 groups, one per decoder head, the way the coarse
# levels split their 256-channel value into 8 x 32: each head reads its own 32-channel sub-map
# instead of projecting the shared 64-channel map. The two depthwise blocks are grouped (8), so
# each head's sub-map is refined independently, and fine_key_aware lets each head's weights read
# what it sampled.
#
# Why: the 64-channel shared map made all 8 heads project the same content (their 32-dim views
# overlap heavily in 64 dims); a 256-channel map split 8 x 32 gives each head a full, disjoint
# view. Widening the map is cheap (about +3 GFLOPs); the grouped blocks keep the refinement cheap
# (a normal 256-channel 1x1 block would be 8x the cost). Cost at 800x800: about 126 GFLOPs vs the
# baseline's 115 and the shared 64-channel fine level's 120.

__include__: ['../DFine-S-AITOD.yml']

output_dir: ./outputs/ablation/aitod_s_fine_grouped

epoches: 160

HGNetv2:
  return_stem: True

HybridEncoder:
  fine_in_channels: 32
  fine_dim: 256
  fine_blocks: 2
  fine_groups: 8

DFINETransformer:
  fine_channels: 256
  fine_groups: 8
  fine_key_aware: True
  num_points: [6, 6, 4, 4, 4]
