task: detection

# AI-TOD-v2, read from https://huggingface.co/datasets/shijli/aitod-v2
# (official v2 annotations; the AI-TOD protocol trains on train + validation and reports on test)
#
# The tiles are 800x800 already and stay so: the resize acts on RandomIoUCrop's zoomed-in crops
# (a 30% to 100% region scaled up to 800x800) and on RandomZoomOut's shrunken ones, as in the
# original recipe. Zoom-out was dropped here once, on the reasoning that it shrinks objects that
# are minute to begin with; against the legacy Dome run that reasoning loses, and it loses
# exactly where zoom-out acts: APvt 15.4 against 17.7 and ARvt 24.2 against 29.7, while medium
# objects are ahead. Under 8 px is the scarcest bucket in the split and zoom-out is what fills
# it. Mosaic and mix-up stay out.
# Orthogonal aerial imagery: every orientation is as natural as any other, so both flips and the
# 90-degree rotations are free data, and they stay (the legacy recipe has neither).

evaluator:
  type: AITODEvaluator
  iou_types: ['bbox', ]

num_classes: 8  # labels are the official AI-TOD-v2 ids 0..7

train_dataloader:
  type: DataLoader
  dataset:
    type: AITODDetection
    split: train+validation
    transforms:
      type: Compose
      ops:
        # torchvision's default range, which the legacy Dome run also used: the canvas grows up
        # to 4x, so the median box drops from 12.6 px to 7.9 and 18% of the boxes land under
        # 4 px. A cap at 2x leaves the median at 12.0 px with 3.4% under 4 px, but the very
        # tiny bucket is where the legacy run beats us (APvt 17.7 against 15.4) and 4x is what
        # it trained with, so match it; the cap is the variant to try if vt still lags
        - {type: RandomZoomOut, fill: 0}
        - {type: RandomIoUCrop, p: 0.8}
        - {type: SanitizeBoundingBoxes, min_size: 1}
        - {type: RandomHorizontalFlip}
        - {type: RandomVerticalFlip}
        - {type: RandomRotate90}  # 0, 90, 180 or 270 degrees, equally likely
        - {type: Resize, size: [800, 800]}  # the tiles' own size; a zoomed-in crop is scaled up to it
        - {type: SanitizeBoundingBoxes, min_size: 1}
        # after the resize, still on the PIL image: a pixel-wise colour change commutes with the
        # crops and the resize, and PIL does it in 30 ms on 800x800 against 70 ms on the full-size
        # image (torchvision's tensor version takes 50 ms on the single thread a worker has)
        - {type: RandomPhotometricDistort, p: 0.5}
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
        - {type: ConvertBoxes, fmt: 'cxcywh', normalize: True}
      policy:
        # from this epoch on the listed augmentations are switched off (the flips and rotations stay)
        name: stop_epoch
        epoch: 72
        ops: ['RandomPhotometricDistort', 'RandomZoomOut', 'RandomIoUCrop']
  shuffle: True
  num_workers: 4

val_dataloader:
  type: DataLoader
  dataset:
    type: AITODDetection
    split: test
    transforms:
      type: Compose
      ops:
        - {type: Resize, size: [800, 800]}  # the tiles' own size
        - {type: ConvertPILImage, dtype: 'float32', scale: True}
  shuffle: False
  num_workers: 4
